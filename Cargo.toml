[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "slotforge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform save manager for PC games."

[lib]
name = "slotforge"
path = "src/lib.rs"

[[bin]]
name = "slotforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
