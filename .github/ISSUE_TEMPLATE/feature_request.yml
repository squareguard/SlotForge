name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve. For large features, consider opening a discussion before implementing.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like SlotForge to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - All
    validations:
      required: false
