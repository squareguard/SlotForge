[workspace]
members = [".", "src-tauri"]
resolver = "2"

[package]
name = "slotforge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform save manager for PC games."
repository = "https://github.com/squareguard/SlotForge"
homepage = "https://github.com/squareguard/SlotForge"
readme = "README.md"
keywords = ["games", "saves", "backup", "tauri", "desktop"]
categories = ["filesystem", "command-line-utilities"]

[lib]
name = "slotforge"
path = "src/lib.rs"

[[bin]]
name = "slotforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
fs2 = "0.4"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
