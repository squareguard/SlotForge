[package]
name = "slotforge-desktop"
version = "0.1.0"
description = "SlotForge desktop shell"
authors = ["SlotForge"]
edition = "2021"

[lib]
name = "slotforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slotforge-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
slotforge = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5", features = [] }
tauri-plugin-dialog = "2.2"
